# Drop-in for the unit Pomerium's rpm brings: bind 80 and 443 as the pomerium user, wait for the network, and keep
# the file databroker (sessions and registered clients) under /var/lib/pomerium. Certificates stay in the rpm unit's
# AUTOCERT_DIR, /etc/pomerium.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
StateDirectory=pomerium
StateDirectoryMode=0700
