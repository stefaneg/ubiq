# Pomerium Core for the dev Deployment. Dev-only secrets; never reuse.
authenticate_service_url: https://authenticate.localhost.pomerium.io

certificate_file: /pomerium/certs/localhost.pomerium.io.pem
certificate_key_file: /pomerium/certs/localhost.pomerium.io-key.pem

shared_secret: xvzY4BYewrtVFsQz1vZvFoz/5ld7Im366dq72ZEpAXY=
cookie_secret: 73WkDa2HBTinF9f38aZ4SfD6BbAm2l+CRrH7TbcTLF4=
databroker_storage_type: file
databroker_storage_connection_string: file:///data/pomerium

# The Identity Provider: Keycloak realm "ubiq" (dev/keycloak/ubiq-realm.json).
idp_provider: oidc
idp_provider_url: http://keycloak.localhost.pomerium.io:8080/realms/ubiq
idp_client_id: pomerium
idp_client_secret: cb4f643442f24e06296c8807aa5c7ef2

routes:
  # Shows the assertion JWT Pomerium forwards, groups claim included.
  - from: https://verify.localhost.pomerium.io
    to: http://verify:8000
    pass_identity_headers: true
    policy:
      - allow:
          or:
            - domain:
                is: ubiq.test

  # The Server's MCP endpoint, once it runs on the host. host.docker.internal is Docker Desktop's name for the host.
  - from: https://mcp.localhost.pomerium.io
    to: http://host.docker.internal:8766
    name: Ubiq MCP
    pass_identity_headers: true
    mcp:
      server: {}
    policy:
      - allow:
          or:
            - domain:
                is: ubiq.test
