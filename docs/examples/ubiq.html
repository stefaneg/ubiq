<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>glossary</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#1b1d21;--fg:#e8e8e4;--muted:#9aa0a8;--line:#34373d;--panel:#24272d;--panel2:#2b2f36;
  --accent:#8ab4f8;--accent-bg:#2a3a52;--amber:#f2c377;--amber-bg:#3d3222;
  --rose:#f49ab0;--rose-bg:#45262e;--teal:#7fd3c4;--teal-bg:#1f3a37;
  --navw:260px;
  font-family: ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5}
a{color:var(--accent)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:#15171a;color:#d6d9de;padding:0 .3em;border-radius:3px}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25}
h4{font-size:.75em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:1.2em 0 .3em}
p{margin:.35em 0}
ul,ol{margin:.3em 0;padding-left:1.3em}
li{margin:.2em 0}
a.t{color:var(--accent);text-decoration:none;border-bottom:1px dotted #5a7399;font-weight:500}
a.t:hover{background:var(--accent-bg)}
.unres{color:var(--rose);border-bottom:1px dashed var(--rose);font-weight:500;cursor:help}
.unres.cand{border-bottom-style:dotted}
.avoid{color:var(--muted);font-size:.85em}
.avoid b{font-weight:600;color:var(--muted)}
.chip{display:inline-block;font-size:.7em;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:.1em .5em;border-radius:999px;vertical-align:middle;margin-left:.4em}
.chip.also{background:#323941;color:#b0bac6;text-transform:none;letter-spacing:0}
.muted{color:var(--muted)}
.small{font-size:.85em}
table.md{border-collapse:collapse;margin:.6em 0;font-size:.9em;background:var(--panel)}
table.md th,table.md td{border:1px solid var(--line);padding:.3em .7em;text-align:left;vertical-align:top}
table.md th{background:var(--panel2);font-weight:600}
.mdh{font-size:.8em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:1.2em 0 .3em}
/* popover */
#pop{position:fixed;z-index:50;max-width:420px;background:#0f1012;color:#f5f5f2;border:1px solid #3d4148;padding:.6em .8em;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.6);font-size:.9em;line-height:1.45;display:none;pointer-events:none}
#pop .n{font-weight:600;margin-bottom:.2em}
#pop .flag{margin-top:.4em;font-size:.85em;color:#fcd79a}
#pop .flag.also{color:#b0bac6}
#pop .flag.unres{color:#f49ab0}
#pop .hint{margin-top:.4em;color:#b0bac6;font-size:.85em}
/* layout: index | handle | main */
#app{display:grid;grid-template-columns:var(--navw) 6px minmax(0,1fr);height:100vh}
.nav{height:100vh;overflow:auto;border-right:1px solid var(--line);padding:1em .8em;background:var(--panel);font-size:.85em}
.nav .tools{display:flex;flex-wrap:wrap;gap:.3em .9em;margin-bottom:.8em}
.nav .tools a{color:#c3c7cd;text-decoration:none;padding:.1em 0;border-bottom:1px solid transparent}
.nav .tools a:hover,.nav .tools a.sel{color:var(--accent)}
.nav .tools a.sel{border-bottom-color:var(--accent)}
.nav .navFilter{width:100%;padding:.4em .6em;border:1px solid var(--line);border-radius:6px;font:inherit;margin-bottom:.8em;background:var(--bg);color:var(--fg)}
.nav .ctx{margin-top:.8em;font-weight:700;text-transform:uppercase;font-size:.75em;letter-spacing:.05em}
.nav .ctx.extra{color:#d0d3d8;margin-top:1.4em;padding-top:.8em;border-top:1px solid var(--line)}
.nav .cl{margin:.4em 0 .1em .2em;font-weight:600;color:#d0d3d8}
.nav .cl .cnt{color:var(--muted);font-weight:400}
.nav a.item{display:block;padding:.05em 0 .05em 1em;color:#c3c7cd;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a.item:hover{color:var(--accent)}
.nav a.item.sel{color:var(--accent);font-weight:600}
.handle{width:6px;cursor:col-resize;background:transparent;border-left:1px solid var(--line);transition:background .15s}
.handle:hover{background:#3f4a5a}
body.dragging{cursor:col-resize;user-select:none}
body.dragging .handle{background:#5a7399}
.mainwrap{overflow:auto;padding:0 2em 6em;height:100vh}
.top{display:flex;gap:1em;align-items:center;position:sticky;top:0;background:var(--bg);padding:1em 0 .6em;z-index:5;border-bottom:1px solid var(--line)}
.top h1{font-size:1.1em;white-space:nowrap}
.top h1 a{color:inherit;text-decoration:none}
.top h1 a:hover{color:var(--accent)}
.search{position:relative;flex:1}
.search input{width:100%;padding:.55em .8em;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:1em;background:var(--panel);color:var(--fg)}
.results{position:absolute;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-height:60vh;overflow:auto;display:none}
.results a{display:flex;justify-content:space-between;padding:.4em .8em;color:inherit;text-decoration:none}
.results a:hover,.results a.hot{background:var(--accent-bg)}
.results .d{color:var(--muted);font-size:.85em;margin-left:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.trail{font-size:.8em;color:var(--muted);margin:.8em 0}
.trail a{color:var(--muted);text-decoration:none}
.trail a:hover{color:var(--accent)}
.body{max-width:1000px}
/* term card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.4em 1.6em;margin-top:.5em}
.card h2{font-size:1.5em}
.card .def{font-size:1.05em;margin:.6em 0}
.card .graph{margin:1em -1.6em 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#1f2227}
.graph svg{display:block;width:100%;height:auto}
.card .sections{margin-top:1em;font-size:.92em}
.card .sections > h4:first-child{margin-top:1.2em}
.card .same{margin:.8em 0 .4em;padding:.6em .8em;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.card .same h4{margin-top:0}
.card .same .note{border-left-width:3px}
.note{padding:.35em .6em;border-left:2px solid var(--line);margin:.3em 0}
.note.lint{border-left-color:var(--amber)}
/* landing */
.landing .cl{margin:.4em 0 1em}
.landing .cl h3{font-size:.95em;margin:.8em 0 .2em}
.landing a.t{display:inline-block;margin:.15em .3em .15em 0;padding:.1em .5em;border:1px solid var(--line);border-radius:999px;background:var(--panel);border-bottom:1px solid var(--line)}
.landing h2{margin-top:1.5em;font-size:1.1em}
/* vocabulary check */
.check textarea{width:100%;min-height:9em;font:inherit;font-size:.95em;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:.7em .9em;resize:vertical}
.check .out{margin-top:1em;padding:.9em 1.1em;border:1px solid var(--line);border-radius:8px;background:var(--panel);white-space:pre-wrap;line-height:1.7}
.check table.md{width:100%}
.legend2{font-size:.85em;color:var(--muted);margin:.5em 0}
.legend2 span{margin-right:1.2em}
/* ADR */
.adrbody{font-size:.95em;margin-top:1em}
.adrbody p{margin:.6em 0}
.adr .terms a.t{display:inline-block;margin:.15em .3em .15em 0;padding:.05em .5em;border:1px solid var(--line);border-radius:999px;background:var(--panel2)}
/* health */
.health .rule{margin:1em 0;padding:.8em 1em;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.health .rule h3{font-size:1em}
.health .rule .n{display:inline-block;min-width:2.2em;text-align:center;padding:.05em .5em;border-radius:999px;background:var(--panel2);margin-right:.5em;font-size:.9em}
.health .rule .n.zero{color:var(--muted)}
.health .rule .n.hot{background:var(--amber-bg);color:var(--amber)}
.health .rule .why{color:var(--muted);font-size:.88em;margin:.2em 0 .5em}
.health .rule .why q{color:#c3c7cd}
.health ul{columns:2;column-gap:2em;font-size:.92em}
.health ul li{break-inside:avoid}
/* svg nodes */
.node{cursor:pointer}
.node circle{fill:#2b2f36;stroke:#9aa0a8;stroke-width:1.5}
.node.centre circle{fill:#e8e8e4;stroke:#e8e8e4}
.node.centre text{fill:#f3f3f0;font-weight:600;font-size:12px}
.node text{font-size:11px;fill:#d6d9de;pointer-events:none}
.edge{stroke:#6b7480;stroke-width:1.2;fill:none}
.elabel{font-size:10px;fill:var(--muted)}
</style>
</head>

<script>
// ------------------------------------------------------------------ model

DATA.contexts.forEach(c => (c.clusters ||= []).forEach(cl => cl.terms ||= []));
DATA.adrs ||= []; DATA.adrs.forEach(a => a.terms ||= []);
DATA.relationships ||= []; DATA.relationships.forEach(r => { r.terms ||= []; r.contexts ||= []; });
DATA.unresolved ||= [];
DATA.health ||= [];
const CTX_NAME = Object.fromEntries(DATA.contexts.map(c => [c.key, c.name]));
const ctxCls = k => 'ctx-' + k;
{ // one colour per context
  const PALETTE = [['#8ab4f8', '#2a3a52'], ['#7fd3c4', '#1f3a37'], ['#a8d68a', '#283823'], ['#f0a57a', '#40291e'], ['#e2a6e8', '#3d2741'], ['#d6d9de', '#34373d']];

const redirectIndex = {};

const tmp = document.createElement('div');
const textOf = h => { tmp.innerHTML = h; return tmp.textContent; };
const chip = (cls, txt, title) => `<span class="chip ${cls}" title="${esc(title || '')}">${txt}</span>`;

  const t = T[id]; let s = '';

  const sw = sameWord(id);

// ------------------------------------------------------------------ popover
const pop = document.getElementById('pop');
function popUnresolved(u) {

  return `<div class="n">${esc(phrase)}</div><div class="flag unres">No glossary entry. This phrase is marked like a term (${u.classList.contains('cand') ? 'a Capitalised Phrase in the checked text' : 'bold in the file'}), but no GLOSSARY.md defines it.</div>`

function popTerm(id) {

document.addEventListener('mouseover', e => {

  let h = '';

document.addEventListener('mousemove', e => { if (pop.style.display === 'block') place(e); });

function place(e) {

// ------------------------------------------------------------------ neighbourhood diagram
const nodeCls = id => `node ${ctxCls(T[id].context)}`;
// Referenced-by left, refers-to right.
function neighbourhood(id, W = 940) {
  const outs = T[id].refs, ins = inbound[id].filter(x => !outs.includes(x));
  const rowH = 26, colX = 170;
  const H = Math.max(160, Math.max(outs.length, ins.length) * rowH + 60);
  const cx = W / 2, cy = H / 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  const col = (ids, x, anchor) => ids.map((x2, i) => ({ id: x2, x, y: cy - (ids.length - 1) * rowH / 2 + i * rowH, anchor }));
  const L = col(ins, colX, 'end'), R = col(outs, W - colX, 'start');
  for (const d of L) s += `<path class="edge" d="M${d.x + 8},${d.y} C${cx - 60},${d.y} ${cx - 60},${cy} ${cx - 10},${cy}" marker-end="url(#arr)"/>`;
  for (const d of R) s += `<path class="edge" d="M${cx + 10},${cy} C${cx + 60},${cy} ${cx + 60},${d.y} ${d.x - 8},${d.y}" marker-end="url(#arr)"/>`;
  s += `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker></defs>`;
  s += `<text class="elabel" x="${colX}" y="${cy - (Math.max(ins.length, 1) - 1) * rowH / 2 - 22}" text-anchor="end">referenced by (${ins.length})</text><text class="elabel" x="${W - colX}" y="${cy - (Math.max(outs.length, 1) - 1) * rowH / 2 - 22}">refers to (${outs.length})</text>`;
  const side = d => `<g class="${nodeCls(d.id)}" data-id="${d.id}" transform="translate(${d.x},${d.y})"><circle r="6"></circle><text x="${d.anchor === 'end' ? -12 : 12}" y="4" text-anchor="${d.anchor}">${esc(T[d.id].name)}</text></g>`;
  s += L.map(side).join('') + R.map(side).join('');
  s += `<g class="node centre" data-id="${id}" transform="translate(${cx},${cy})"><circle r="10"></circle><text x="0" y="-16" text-anchor="middle">${esc(T[id].name)}</text></g></svg>`;
  return s;
}
// ------------------------------------------------------------------ term card
const adrLink = a => `<a href="#${a.id}">${esc(a.title)}</a>`;
const relNote = r => `<div class="note">${r.label ? `<b>${esc(r.label)}</b>` : ''}${r.contexts.map(k => chip(ctxCls(k), CTX_NAME[k])).join('')}<div>${r.html}</div></div>`;
const adrChip = a => a.context ? chip(ctxCls(a.context), CTX_NAME[a.context]) : chip('also', 'system-wide');
function sameWordBlock(id) {
  const sw = sameWord(id); if (!sw.length) return '';
  return `<div class="same"><h4>Same name in another context</h4>${sw.map(x => `<div class="note">${link(x)}${ctxChip(x)}<div class="small muted">${esc(textOf(T[x].definition))}</div></div>`).join('')}</div>`;
}
function decisionsBlock(id) {
  return `<h4>Decisions touching this term (${adrsFor[id].length})</h4>` + (adrsFor[id].map(a => `<div class="note">${adrLink(a)} ${adrChip(a)}<div class="small muted">${esc(a.path)}</div></div>`).join('') || '<div class="muted">no ADR names this term</div>');

function healthBlock(id) {
  const f = termFindings(id);
  return `<h4>Health (${f.length})</h4>` + (f.map(({ r, x }) => `<div class="note lint"><b>${esc(r.name)}</b> <span class="muted small">${esc(x.note)}</span></div>`).join('') || '<div class="muted">no findings</div>');
}
function termCard(id) {
  const t = T[id];
  return `<div class="card"><h2>${esc(t.name)}${badges(id)}</h2><div class="muted small">${esc(t.cluster)} · line ${t.line} of ${esc(DATA.contexts.find(c => c.key === t.context).path)}</div>
    <div class="def">${t.definition}</div>${avoidLine(t)}
    ${sameWordBlock(id)}
    <div class="graph">${neighbourhood(id)}</div>
    <div class="sections">${relsFor[id].length ? `<h4>Context relationships (${relsFor[id].length})</h4>${relsFor[id].map(relNote).join('')}` : ''}${decisionsBlock(id)}${healthBlock(id)}</div></div>`;
}
// Landing: every term as a chip, grouped by context and cluster.
function landingHtml() {
  let h = '<div class="landing"><p class="muted">Pick a term to explore it with its neighbourhood.</p>';
  for (const c of DATA.contexts) { h += `<h2>${esc(c.name)}${chip(ctxCls(c.key), c.key)}</h2>`; for (const cl of c.clusters) if (cl.terms.length) h += `<div class="cl"><h3>${esc(cl.name)}</h3>${cl.terms.map(id => link(id)).join('')}</div>`; }

// ------------------------------------------------------------------ index
function navTree(nav) {
  let h = `<div class="tools"><a href="#check" data-id="check">Vocabulary check</a><a href="#health" data-id="health">Health report</a><a href="#map" data-id="map">Context map</a></div><input type="search" placeholder="filter index…" class="navFilter">`;
  for (const c of DATA.contexts) {
    h += `<div class="ctx ${ctxCls(c.key)}">${esc(c.name)}</div>`;
    for (const cl of c.clusters) if (cl.terms.length) h += `<div class="cl">${esc(cl.name)} <span class="cnt">${cl.terms.length}</span></div>` + cl.terms.map(id => `<a class="item" href="#${id}" data-id="${id}">${esc(T[id].name)}</a>`).join('');
  }
  if (DATA.adrs.length) h += `<div class="ctx extra">Decisions (ADRs)</div>` + DATA.adrs.map(a => `<a class="item" href="#${a.id}" data-id="${a.id}" title="${esc(a.title)}">${esc(a.title)}</a>`).join('');

    const q = e.target.value.toLowerCase();

    nav.querySelectorAll('.cl').forEach(h => { let n = h.nextElementSibling, any = false; while (n && n.tagName === 'A') { if (n.style.display !== 'none') any = true; n = n.nextElementSibling; } h.style.display = any ? '' : 'none'; });

function navSelect(nav, id) {
  nav.querySelectorAll('a.sel').forEach(e => e.classList.remove('sel'));
  const na = id && nav.querySelector(`a[data-id="${CSS.escape(id)}"]`);
  if (!na) return;
  na.classList.add('sel');
  if (na.classList.contains('item')) { const top = na.offsetTop - nav.clientHeight / 2; if (Math.abs(nav.scrollTop - top) > nav.clientHeight / 2) nav.scrollTop = top; }

// Search box: names and Avoid words, keyboard-driven, `/` focuses.
const avoidWords = t => (t.avoid || '').split(/,\s*/).map(w => w.replace(/\s*\([^)]*\)/g, '').trim().toLowerCase()).filter(Boolean);
function searchBox(wrap) {
  wrap.innerHTML = `<input placeholder="search a term… (type, ↑↓, Enter)" autocomplete="off"><div class="results"></div>`;
  const q = wrap.querySelector('input'), res = wrap.querySelector('.results');
  const all = Object.keys(T).sort((a, b) => T[a].name.localeCompare(T[b].name));
  let hot = 0;
  function search() {
    const v = q.value.trim().toLowerCase(); if (!v) { res.style.display = 'none'; return; }
    const hits = all.filter(id => T[id].name.toLowerCase().includes(v) || avoidWords(T[id]).some(w => w.includes(v))).slice(0, 25);
    hot = 0;
    res.innerHTML = hits.map((id, i) => { const viaAvoid = !T[id].name.toLowerCase().includes(v) && avoidWords(T[id]).find(w => w.includes(v));
      return `<a href="#${id}" class="${i === 0 ? 'hot' : ''}"><span>${esc(T[id].name)}${badges(id)}</span><span class="d">${viaAvoid ? `avoid “${esc(viaAvoid)}” → use this` : esc(textOf(T[id].definition))}</span></a>`; }).join('') || '<a>no match</a>';

  q.addEventListener('focus', search);

    as.forEach((a, i) => a.classList.toggle('hot', i === hot));
  });

}
// Draggable splitter: sets --navw on the app; width lives in memory only.
function splitter(root, handle) {
  handle.addEventListener('mousedown', e => {
    const startX = e.clientX, startW = parseFloat(getComputedStyle(root).getPropertyValue('--navw')) || 260;

// ------------------------------------------------------------------ vocabulary check (same rules as `glossary check`)
function checkText(text) {
  const phrases = [];
  for (const id in T) phrases.push({ p: T[id].name.toLowerCase(), ids: [id] });
  phrases.sort((a, b) => b.p.length - a.p.length);
  const byPhrase = {}; phrases.forEach(x => byPhrase[x.p] ||= x);
  const re = new RegExp('(?<![\\w-])(' + phrases.map(x => escRe(x.p)).join('|') + ')(s|es)?(?![\\w-])', 'gi');
  const hits = { term: new Map(), cand: new Map() };
  const segs = [];
  text.replace(re, (m, p, pl, off) => { segs.push({ off, len: m.length, x: byPhrase[p.toLowerCase()] }); return m; });
  const candRe = /\b([A-Z][a-z]+(?:[- ][A-Z][a-z]+)+)\b/g, detRe = /^(?:The|A|An|This|That|These|Those|Each|Every|Any|Some|No|All|Both|Either|Neither|Its|Their|Our|Your|My|His|Her)[- ]/;
  let cm; while ((cm = candRe.exec(text))) {
    const lead = (cm[0].match(detRe) || [''])[0], off = cm.index + lead.length, len = cm[0].length - lead.length;
    if (/[- ]/.test(text.substr(off, len)) && !segs.some(sg => off < sg.off + sg.len && off + len > sg.off)) segs.push({ off, len, cand: true });
  }
  segs.sort((a, b) => a.off - b.off);

function checkPage() {

  return `<div class="check"><h2>Vocabulary check</h2><p class="muted">Paste an issue title, PR description, commit message or doc paragraph. Recognised terms link as usual; Capitalised Phrases without an entry are dotted red. Nothing is stored. The same check runs from the terminal as <code>ubiq check</code>.</p>
    <textarea class="src">${esc(sample)}</textarea>
    <div class="legend2"><span><a class="t" href="#" onclick="return false">glossary term</a></span><span><span class="unres cand">candidate term</span></span></div>
    <div class="out"></div><div class="summary"></div></div>`;
}
function wireCheck(body) {

  const run = () => {
    const r = checkText(src.value); out.innerHTML = r.html || '<span class="muted">nothing to check</span>';
    const termRows = [...r.hits.term.entries()].map(([id, n]) => `${link(id)}${badges(id)} <span class="muted">×${n}</span>`).join('<br>');
    const cands = [...r.hits.cand.keys()].map(c => `<span class="unres cand">${esc(c)}</span>`).join(', ');
    sum.innerHTML = `<h4>Terms recognised (${r.hits.term.size})</h4>${termRows || '<div class="muted">none</div>'}
      <h4>Capitalised phrases without an entry (${r.hits.cand.size})</h4>${cands || '<div class="muted">none</div>'}`;

}
// ------------------------------------------------------------------ decisions and contexts
function adrPage(id) {
  const a = ADR[id]; if (!a) return '<div class="card">Unknown ADR</div>';

    <h4>Terms touched (${a.terms.length})</h4><div class="terms">${a.terms.map(x => link(x)).join('') || '<span class="muted">no glossary name appears in this ADR</span>'}</div>
    <div class="adrbody">${a.html}</div></div>`;
}
function mapPage() {

  h += DATA.contexts.map(c => `<div class="note"><b>${esc(c.name)}</b> ${chip(ctxCls(c.key), c.key)} <span class="muted small">${esc(c.path)} · ${c.clusters.reduce((n, cl) => n + cl.terms.length, 0)} terms</span>${c.intro}</div>`).join('');

// ------------------------------------------------------------------ glossary health (findings from `ubiq health`)
const RULES = [
  { key: 'long', name: 'Definition longer than two sentences', why: 'Keep definitions tight. One or two sentences max. Define what it IS, not what it does.' },
  { key: 'orphan', name: 'Term nothing else mentions', why: 'A term no other definition or context relationship refers to is either new vocabulary or a candidate for removal.' },
  { key: 'unmapped', name: 'Same name in two contexts, no relationship mentions it', why: 'A name two contexts both define is either a deliberate difference or a word one of them should drop. A context relationship between the two that mentions the name records which.' },
  { key: 'unresolved', name: 'Bold phrase or relationship label with no match', why: 'A phrase written like a term is a claim that a term exists, and a relationship label names contexts. Either add the term or context, or drop the bold.' },
];
const findingsOf = rule => DATA.health.filter(f => f.rule === rule);
const termFindings = id => DATA.health.filter(f => f.term === id).map(x => ({ r: RULES.find(r => r.key === x.rule), x }));
function healthPage() {
  let h = `<div class="health"><h2>Glossary health</h2><p class="muted">Checks derived from the glossary format rules in the domain-modeling skill, over ${Object.keys(T).length} terms. Each term card shows its own findings at the foot.</p>`;
  for (const r of RULES) {
    const f = findingsOf(r.key), n = new Set(f.map(x => x.term || x.name)).size;
    h += `<div class="rule"><h3><span class="n ${n ? 'hot' : 'zero'}">${n}</span>${esc(r.name)}</h3><div class="why"><q>${esc(r.why)}</q></div>`;
    if (f.length) h += `<details><summary class="small">show</summary><ul>${f.map(x => `<li>${x.term ? link(x.term) + ctxChip(x.term) : `<span class="unres">${esc(x.name)}</span>`} <span class="muted small">${esc(x.note)}</span></li>`).join('')}</ul></details>`;
    h += '</div>';
  }
  return h + '</div>';
}

const app = document.getElementById('app'), nav = app.querySelector('.nav'), body = app.querySelector('.body'), trailEl = app.querySelector('.trail'), wrap = app.querySelector('.mainwrap');
